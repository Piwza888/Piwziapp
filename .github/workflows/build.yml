name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o piwzi-app.zip -d _build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: _build/piwzi-app
        run: npm ci || npm install
      - name: Build APK
        working-directory: _build/piwzi-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PiwziIntercom-apk
          path: _build/piwzi-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
